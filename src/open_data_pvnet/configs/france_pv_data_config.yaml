general:
  name: "france_pv_config"
  description: "Configuration for France PV generation data from RTÉ"

input_data:
  generation:
    # Path to processed France solar Zarr
    zarr_path: "./data/fra/france_pv_generation.zarr"
    time_resolution_minutes: 30
    start_date: "2020-01-01"
    end_date: "2024-12-31"
    timezone: "UTC"
    public: True

metadata:
  country: "France"
  gsp_id: "FR"
  latitude: 46.6
  longitude: 2.5

output:
  format: "zarr"
  csv_backup: True

