# @package _global_

# to execute this experiment run:
# python run.py experiment=example_us_run.yaml

defaults:
  - override /trainer: default.yaml
  - override /model: multimodal.yaml
  - override /datamodule: streamed_batches.yaml
  - override /callbacks: default.yaml
  - override /logger: wandb.yaml
  - override /hydra: default.yaml

seed: 518

trainer:
  min_epochs: 1
  max_epochs: 2

datamodule:
  batch_size: 4
  configuration: "src/open_data_pvnet/configs/PVNet_configs/datamodule/configuration/us_configuration.yaml"
  num_train_samples: 10
  num_val_samples: 5
