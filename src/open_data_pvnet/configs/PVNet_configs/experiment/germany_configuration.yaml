general:
  description: Configuration for Germany GFS and PV data
  name: germany_config

input_data:
  # Using GSP configuration for Germany PV data (SMARD)
  gsp:
    # Path to GSP data in zarr format
    zarr_path: 
    interval_start_minutes: -60
    # Specified for intraday currently
    interval_end_minutes: 480
    time_resolution_minutes: 15
    # Random value from the list below will be chosen as the delay when dropout is used
    # If set to null no dropout is applied. Only values before t0 are dropped out for GSP.
    # Values after t0 are assumed as targets and cannot be dropped.
    dropout_timedeltas_minutes: []
    dropout_fraction: 0.0 # Fraction of samples with dropout
    # public: True

  nwp:
    gfs:
      time_resolution_minutes: 180 # Match the dataset's resolution (3 hours)
      interval_start_minutes: -180
      interval_end_minutes: 540
      dropout_fraction: 0.0
      dropout_timedeltas_minutes: []
      zarr_path: 
      provider: "gfs"
      image_size_pixels_height: 2
      image_size_pixels_width: 2
      # public: True
      channels:
        - dlwrf # downwards long-wave radiation flux
        - dswrf # downwards short-wave radiation flux
        - hcc # high cloud cover
        - lcc # low cloud cover
        - mcc # medium cloud cover
        - prate # precipitation rate
        - r # relative humidity
        - sde # snow depth
        - t # 2-metre temperature
        - tcc # total cloud cover
        - u10 # 10-metre wind U component
        - u100 # 100-metre wind U component
        - v10 # 10-metre wind V component
        - v100 # 100-metre wind V component
        - vis # visibility
      normalisation_constants:
        dlwrf:
          mean: 298.342
          std: 96.305916
        dswrf:
          mean: 168.12321
          std: 246.18533
        hcc:
          mean: 58.015
          std: 44.925
        lcc:
          mean: 57.015
          std: 43.814
        mcc:
          mean: 52.572
          std: 45.083
        prate:
          mean: 3.6732e-05
          std: 0.00010917
        r:
          mean: 18.359747
          std: 25.440672
        sde:
          mean: 256.228
          std: 551.837
        t:
          mean: 278.5223
          std: 22.825893
        tcc:
          mean: 66.841606
          std: 41.030598
        u10:
          mean: -0.0022310058
          std: 5.470838
        u100:
          mean: 0.0823025
          std: 6.8899174
        v10:
          mean: 0.06219831
          std: 4.7401133
        v100:
          mean: 0.0797807
          std: 6.076132
        vis:
          mean: 22119.357
          std: 5264.508
  solar_position:
    interval_start_minutes: -60
    interval_end_minutes: 480
    time_resolution_minutes: 30
