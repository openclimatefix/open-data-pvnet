#--------------------------------------------
# Tabular network settings
#--------------------------------------------

output_network:
  _target_: pvnet.models.multimodal.linear_networks.networks.ResFCNet 
  _partial_: True 
  fc_hidden_features: 128
  n_res_blocks: 2
  res_block_layers: 2
  dropout_frac: 0.0

embedding_dim: 16
include_sun: True
include_time: False
include_gsp_yield_history: False
include_site_yield_history: False

# The mapping between the location IDs and their embedding indices
# location_id_mapping:
#   1: 1
#   5: 2
#   110: 3
# ...

#--------------------------------------------
# Times
#--------------------------------------------

# Forecast and time settings
forecast_minutes: 480
history_minutes: 120 

sat_history_minutes: 90
min_sat_delay_minutes: 30 

# These must also be set even if identical to forecast_minutes and history_minutes
# pv_history_minutes: 180
pv_interval_minutes: 5 
sat_interval_minutes: 5

# These must be set for each NWP encoder
nwp_history_minutes:
  ukv: 120 
nwp_forecast_minutes:
  ukv: 480
nwp_interval_minutes:
  ukv: 60

