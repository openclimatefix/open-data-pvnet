general:
  description: Configuration for US GFS and EIA data
  name: us_config

input_data:
  gsp:
    # Path to US EIA data in zarr format (generated by collect_eia_data.py)
    zarr_path: "src/open_data_pvnet/data/target_eia_data.zarr"
    interval_start_minutes: -60
    interval_end_minutes: 480
    time_resolution_minutes: 60 # EIA data is hourly
    dropout_timedeltas_minutes: []
    dropout_fraction: 0.0
    public: True

  nwp:
    gfs:
      time_resolution_minutes: 180 # Match the dataset's resolution (3 hours)
      interval_start_minutes: -180
      interval_end_minutes: 540 # Cover the forecast horizon
      dropout_fraction: 0.0
      dropout_timedeltas_minutes: []
      zarr_path: "s3://ocf-open-data-pvnet/data/gfs.zarr"
      provider: "gfs"
      image_size_pixels_height: 2
      image_size_pixels_width: 2
      public: True
      channels:
        - dlwrf
        - dswrf
        - hcc
        - lcc
        - mcc
        - prate
        - r
        - t
        - tcc
        - u10
        - u100
        - v10
        - v100
        - vis
      # Normalisation constants (generic or calculated, using defaults from example for now)
      normalisation_constants:
        dlwrf:
          mean: 298.342
          std: 96.305916
        dswrf:
          mean: 168.12321
          std: 246.18533
        hcc:
          mean: 35.272
          std: 42.525383
        lcc:
          mean: 43.578342
          std: 44.3732
        mcc:
          mean: 33.738823
          std: 43.150745
        prate:
          mean: 2.8190969e-05
          std: 0.00010159573
        r:
          mean: 18.359747
          std: 25.440672
        t:
          mean: 278.5223
          std: 22.825893
        tcc:
          mean: 66.841606
          std: 41.030598
        u10:
          mean: -0.0022310058
          std: 5.470838
        u100:
          mean: 0.0823025
          std: 6.8899174
        v10:
          mean: 0.06219831
          std: 4.7401133
        v100:
          mean: 0.0797807
          std: 6.076132
        vis:
          mean: 19628.32
          std: 8294.022
  
  solar_position:
    interval_start_minutes: -60
    interval_end_minutes: 480
    time_resolution_minutes: 60
