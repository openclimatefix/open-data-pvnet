# Data Configuration for open-data-pvnet
# ========================================
# 
# This configuration file defines the input data modalities for training PVNet.
# All modalities are OPTIONAL - you can use any combination of:
#   - gsp (Grid Supply Point / Generation data) 
#   - solar_position (solar azimuth/elevation features)
#   - nwp (Numerical Weather Prediction data)
#   - satellite (Satellite imagery)
#
# Simply omit any section you don't want to use.
#
# See configs/examples/ for more configuration templates:
#   - gsp_only_config.yaml    : Minimal GSP-only setup
#   - gsp_solar_config.yaml   : GSP + Solar Position
#   - gsp_nwp_config.yaml     : GSP + NWP (common use case)
#   - full_config.yaml        : All modalities enabled

general:
  description: "Default Configuration - GSP + Solar Position"
  name: "default"

input_data:
  # GSP (Grid Supply Point) - Generation data
  # This is typically required as it provides the target variable
  gsp:
    # Local path - update to your actual data location
    zarr_path: "data/gsp/combined_2023_gsp.zarr"
    time_resolution_minutes: 30
    interval_start_minutes: -120
    interval_end_minutes: 480
    dropout_timedeltas_minutes: []
    dropout_fraction: 0.0

  # Solar Position - Computed features (no data file needed)
  # Provides solar azimuth and elevation based on location and time
  solar_position:
    time_resolution_minutes: 30
    interval_start_minutes: -120
    interval_end_minutes: 480

  # NWP (Numerical Weather Prediction) - OPTIONAL
  # Uncomment the section below to include NWP data
  # nwp:
  #   gfs:
  #     zarr_path: "s3://ocf-open-data-pvnet/data/gfs/v4/2023.zarr"
