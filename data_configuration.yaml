  #     channels:
  #       - t
  #       - dswrf
  #       - tcc
  #     normalisation_constants:
  #       t:
  #         mean: 278.5223
  #         std: 22.825893
  #       dswrf:
  #         mean: 168.12321
  #         std: 246.18533
  #       tcc:
  #         mean: 66.841606
